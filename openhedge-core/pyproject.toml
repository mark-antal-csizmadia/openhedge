[project]
name = "openhedge-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mark-antal-csizmadia", email = "mark.antal.csizmadia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openapi-python-client>=0.29.0",
    "openrouter>=1.1.55",
    "pydantic>=2.11.2,<2.13",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# "E": Error (pycodestyle) / Style & PEP 8, "F": Pyflakes / Logical Bugs, "I": isort / Import Sorting
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff]
line-length = 120
target-version = "py312"

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
