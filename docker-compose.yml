services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  setup-qdrant:
    build:
      context: .
      dockerfile: openhedge-core/Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: markets
    command: ["python", "-m", "openhedge_core.setup_qdrant"]
    restart: "no"

  sync-markets:
    build:
      context: .
      dockerfile: openhedge-core/Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      setup-qdrant:
        condition: service_completed_successfully
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: markets
      SYNC_INTERVAL_SECONDS: "3600"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    command: ["/app/sync-loop.sh"]
    stop_grace_period: 60s

  api:
    build:
      context: .
      dockerfile: openhedge-core/Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
      setup-qdrant:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: markets
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      API_HOST: 0.0.0.0
    command: ["python", "-m", "openhedge_core.server"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mcp:
    build:
      context: .
      dockerfile: openhedge-core/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      OPENHEDGE_API_URL: http://api:8000
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
    command: ["python", "-m", "openhedge_core.mcp_server"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  qdrant_data:
